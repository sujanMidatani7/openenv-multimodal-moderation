[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openenv-multimodal-moderation"
version = "1.0.0"
description = "OpenEnv multimodal content moderation environment with lightweight policy retrieval."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.115.12",
  "uvicorn[standard]==0.42.0",
  "openenv-core==0.2.3",
  "pydantic==2.12.5",
  "openai==2.30.0",
  "httpx==0.28.1",
  "pyyaml==6.0.2",
]

[project.scripts]
server = "server.app:main"

[tool.setuptools]
py-modules = ["client", "models"]

[tool.setuptools.packages.find]
include = ["server", "server.*"]
